<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Block Dash Ultra</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050713;color:#fff;font-family:Arial}canvas{display:block;margin:auto;background:#0a1025;width:100vw;height:100vh;max-width:1100px;max-height:700px}.menu{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#17275a,#050713);z-index:2;text-align:center}.card{padding:35px;background:#0c142c;border:2px solid #3454a0;border-radius:22px;box-shadow:0 0 60px #111a44}h1{font-size:55px;margin:0;color:#35ddff}button{padding:14px 28px;border:0;border-radius:10px;font-weight:bold;font-size:18px;cursor:pointer}</style></head><body><div id="menu" class="menu"><div class="card"><h1>⚡ BLOCK DASH</h1><h2>ULTRA</h2><p>Survive waves • collect coins • shoot enemies • defeat the boss</p><p>WASD / Arrows = Move &nbsp; Mouse = Shoot &nbsp; SPACE = Dash</p><button onclick="start()">START</button></div></div><canvas id="c" width="1100" height="700"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d'),menu=document.getElementById('menu');let K={},M={x:550,y:350,down:false},p,E=[],B=[],C=[],P=[],score=0,level=1,xp=0,t=0,shot=0,state='menu',boss=null,best=+localStorage.bdBest||0;
onkeydown=e=>{K[e.key.toLowerCase()]=1;if(e.code==='Space')dash();if(e.key.toLowerCase()==='r'&&state==='dead')start();if(e.key.toLowerCase()==='p'&&(state==='play'||state==='pause'))state=state==='play'?'pause':'play'};onkeyup=e=>K[e.key.toLowerCase()]=0;
c.onmousemove=e=>{let r=c.getBoundingClientRect();M.x=(e.clientX-r.left)*1100/r.width;M.y=(e.clientY-r.top)*700/r.height};c.onmousedown=()=>M.down=1;onmouseup=()=>M.down=0;
function start(){state='play';menu.style.display='none';p={x:550,y:380,s:28,h:100,max:100,sp:4.5,d:1,dash:0,shield:0};E=[];B=[];C=[];P=[];score=0;level=1;xp=0;t=0;shot=0;boss=null;for(let i=0;i<4;i++)spawn('normal')}
function spawn(type){let a=Math.random()*6.28,r=620,e={x:550+Math.cos(a)*r,y:380+Math.sin(a)*r,s:26,h:2,v:1.5,type};if(type==='fast'){e.s=19;e.h=1;e.v=3}if(type==='tank'){e.s=45;e.h=10;e.v=.8}E.push(e)}
function coin(){C.push({x:30+Math.random()*1040,y:90+Math.random()*580})}
function burst(a,b,n=12){for(let i=0;i<n;i++){let q=Math.random()*6.28,s=Math.random()*5+1;P.push({x:a,y:b,vx:Math.cos(q)*s,vy:Math.sin(q)*s,l:35})}}
function dash(){if(state!=='play'||p.dash)return;let dx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),dy=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0);if(!dx&&!dy)dx=1;let n=Math.hypot(dx,dy);p.x+=dx/n*150;p.y+=dy/n*150;p.dash=75;burst(p.x,p.y,25)}
function shoot(){let a=Math.atan2(M.y-p.y,M.x-p.x);B.push({x:p.x,y:p.y,vx:Math.cos(a)*11,vy:Math.sin(a)*11,l:65,d:p.d})}
function hit(a,b,r){return Math.hypot(a.x-b.x,a.y-b.y)<r}
function update(){if(state!=='play')return;let dx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),dy=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0);if(dx||dy){let n=Math.hypot(dx,dy);p.x+=dx/n*p.sp*(p.dash?2:1);p.y+=dy/n*p.sp*(p.dash?2:1)}p.x=Math.max(18,Math.min(1082,p.x));p.y=Math.max(82,Math.min(682,p.y));if(p.dash)p.dash--;if(p.shield)p.shield--;if(--shot<0&&M.down){shoot();shot=8}if(++t>Math.max(18,65-level*4)){spawn(level%5===0?'tank':Math.random()<.3?'fast':'normal');t=0}if(Math.random()<.018&&C.length<5)coin();
B.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.l--;E.forEach(e=>{if(hit(b,e,e.s)){e.h-=b.d;b.l=0;if(e.h<=0){score+=e.type==='tank'?50:20;xp+=10;burst(e.x,e.y,15)}}});if(boss&&hit(b,boss,boss.s)){boss.h-=b.d;b.l=0}});B=B.filter(b=>b.l>0);
E.forEach(e=>{let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.v;e.y+=Math.sin(a)*e.v;if(hit(p,e,(p.s+e.s)/2)){if(p.dash){e.h=0;score+=20}else if(!p.shield)p.h-=.7}});E=E.filter(e=>e.h>0);
if(level>=5&&!boss)boss={x:550,y:100,s:70,h:150+level*20,v:1.1};if(boss){let a=Math.atan2(p.y-boss.y,p.x-boss.x);boss.x+=Math.cos(a)*boss.v;boss.y+=Math.sin(a)*boss.v;if(hit(p,boss,55)&&!p.shield)p.h-=1;if(boss.h<=0){score+=500;xp+=200;burst(boss.x,boss.y,70);boss=null}}
C=C.filter(q=>{if(hit(p,q,25)){score+=10;xp+=5;burst(q.x,q.y,10);return false}return true});P.forEach(z=>{z.x+=z.vx;z.y+=z.vy;z.l--});P=P.filter(z=>z.l>0);
if(xp>=level*100){xp-=level*100;level++;p.max+=10;p.h=p.max;p.sp+=.25;if(level%2===0)p.d++;burst(p.x,p.y,30)}if(p.h<=0){state='dead';best=Math.max(best,score);localStorage.bdBest=best}}
function draw(){x.clearRect(0,0,1100,700);let g=x.createLinearGradient(0,0,0,700);g.addColorStop(0,'#101a3a');g.addColorStop(1,'#050713');x.fillStyle=g;x.fillRect(0,0,1100,700);x.strokeStyle='#17244d';for(let i=0;i<1100;i+=44){x.beginPath();x.moveTo(i,70);x.lineTo(i,700);x.stroke()}for(let i=70;i<700;i+=44){x.beginPath();x.moveTo(0,i);x.lineTo(1100,i);x.stroke()}x.fillStyle='#fff';x.font='bold 19px Arial';x.fillText('❤️ '+Math.ceil(p?.h||0)+'  ⭐ '+score+'  🏆 '+best+'  LV '+level+'  XP '+xp+'/'+level*100,20,35);
C.forEach(q=>{x.shadowBlur=18;x.shadowColor='#ffd43b';x.fillStyle='#ffd43b';x.beginPath();x.arc(q.x,q.y,11,0,7);x.fill();x.shadowBlur=0});B.forEach(b=>{x.fillStyle='#fff';x.fillRect(b.x-3,b.y-3,6,6)});E.forEach(e=>{x.fillStyle=e.type==='tank'?'#a83cff':e.type==='fast'?'#ff9b32':'#ff315a';x.fillRect(e.x-e.s/2,e.y-e.s/2,e.s,e.s);x.fillStyle='#fff';x.fillRect(e.x-8,e.y-5,5,5);x.fillRect(e.x+3,e.y-5,5,5)});if(boss){x.fillStyle='#963cff';x.beginPath();x.arc(boss.x,boss.y,boss.s,0,7);x.fill();x.fillStyle='#fff';x.fillRect(boss.x-18,boss.y-10,10,10);x.fillRect(boss.x+8,boss.y-10,10,10);x.fillStyle='#ff315a';x.fillRect(boss.x-50,boss.y-90,100,8);x.fillStyle='#39ff88';x.fillRect(boss.x-50,boss.y-90,100*Math.max(0,boss.h/(150+level*20)),8)}if(p){x.shadowBlur=25;x.shadowColor='#35ddff';x.fillStyle='#20c8ef';x.fillRect(p.x-14,p.y-14,28,28);x.shadowBlur=0;x.fillStyle='#fff';x.fillRect(p.x-8,p.y-7,5,5);x.fillRect(p.x+3,p.y-7,5,5)}P.forEach(z=>{x.globalAlpha=z.l/35;x.fillStyle='#fff';x.fillRect(z.x,z.y,4,4);x.globalAlpha=1});if(state==='pause'||state==='dead'){x.fillStyle='rgba(0,0,0,.72)';x.fillRect(0,0,1100,700);x.fillStyle='#fff';x.textAlign='center';x.font='bold 60px Arial';x.fillText(state==='dead'?'GAME OVER':'PAUSED',550,320);x.font='22px Arial';x.fillText(state==='dead'?'Press R to restart':'Press P to continue',550,365);x.textAlign='left'}}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
